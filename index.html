<!DOCTYPE html>
<!--
  Planejamento do doutorado sanduíche na UNAM (Dhuna).
  Versão do app: 1.1 (23/11/2026). Versão dos dados salvos (state.v): 5.
  Histórico de mudanças: registre aqui cada alteração, com data e número da versão.
  1.0 (21/11/2026): versão inicial completa (etapas, Kanban, carteira, exportar e importar Excel).
  1.1 (23/11/2026): carteira integrada ao Supabase (recorrências, lançamentos avulsos, cotações, poupança, estadia e depósitos).
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sanduíche na UNAM — planejamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1F7; --surface:#FFFFFF; --ink:#261E36; --muted:#6A6279; --line:#DDD7E6;
  --brand:#5B3FA0; --brand-ink:#FFFFFF; --accent:#B97410; --accent-bg:#FBEFD8; --ok:#2E7D6B;
  --hero:#3A2670; --hero-ink:#F5F1FC; --hero-muted:#C9BDE6;
  --c-udesc:#5B3FA0; --c-mex:#B8691A; --c-fin:#2E7D6B; --c-pes:#3F6FB0;
  --serif:'Spectral',Georgia,'Times New Roman',serif;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17121F; --surface:#211A2D; --ink:#EDE8F5; --muted:#A79FB8; --line:#372E47;
    --brand:#A68BE6; --brand-ink:#1B1228; --accent:#F0B35A; --accent-bg:#3A2D17; --ok:#5CC2A8;
    --hero:#251C3A; --hero-ink:#F2EDFA; --hero-muted:#A99ACB;
    --c-udesc:#A68BE6; --c-mex:#EBA25C; --c-fin:#5CC2A8; --c-pes:#7FA8E6;
  }
}
:root[data-theme="dark"]{
  --bg:#17121F; --surface:#211A2D; --ink:#EDE8F5; --muted:#A79FB8; --line:#372E47;
  --brand:#A68BE6; --brand-ink:#1B1228; --accent:#F0B35A; --accent-bg:#3A2D17; --ok:#5CC2A8;
  --hero:#251C3A; --hero-ink:#F2EDFA; --hero-muted:#A99ACB;
  --c-udesc:#A68BE6; --c-mex:#EBA25C; --c-fin:#5CC2A8; --c-pes:#7FA8E6;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}

.hero{background:var(--hero);color:var(--hero-ink);padding:28px 20px 22px}
.wrap{max-width:1100px;margin:0 auto}
.hero h1{font:600 clamp(26px,5vw,38px)/1.15 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
.hero p{margin:0;color:var(--hero-muted);max-width:60ch}
.hero .count{color:var(--hero-ink);font-weight:600}
.hero-row{display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end;justify-content:space-between}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 22px;margin-top:22px}
.meter .top{display:flex;justify-content:space-between;font-size:13px;color:var(--hero-muted);margin-bottom:5px}
.meter .top b{color:var(--hero-ink);font-weight:500}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--hero-ink);transition:width .35s ease}
.meter[data-cat="udesc"] .bar>i{background:#C8B6F5}
.meter[data-cat="mex"] .bar>i{background:#F2B877}
.meter[data-cat="fin"] .bar>i{background:#7FD6BF}
.meter[data-cat="pes"] .bar>i{background:#9DBDF0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent}
.hero .btn{background:transparent;border-color:rgba(255,255,255,.35);color:var(--hero-ink)}
.hero .btn.primary{background:var(--hero-ink);color:var(--hero);border-color:var(--hero-ink)}
.btn.danger{color:#B3261E;border-color:currentColor;background:transparent}

.bar-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-nav .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;justify-content:space-between;padding:10px 20px}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot[data-cat="udesc"]{background:var(--c-udesc)}
.dot[data-cat="mex"]{background:var(--c-mex)}
.dot[data-cat="fin"]{background:var(--c-fin)}
.dot[data-cat="pes"]{background:var(--c-pes)}
.code{display:inline-block;font:500 12px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.03em;border:1px solid currentColor;border-radius:5px;padding:3px 5px;color:var(--muted);vertical-align:1px;text-decoration:none}
.code[data-cat="udesc"]{color:var(--c-udesc)}
.code[data-cat="mex"]{color:var(--c-mex)}
.code[data-cat="fin"]{color:var(--c-fin)}
.code[data-cat="pes"]{color:var(--c-pes)}
.row-title .code,.card .t .code{margin-right:7px}
.phase-head h2 .code{margin-right:9px;font-size:12px;vertical-align:4px}
.phase-head .btn{padding:4px 11px;font-size:13px}
.chips[hidden]{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile .tl{font-size:13px;color:var(--muted);margin-bottom:6px}
.tile .ts{font-size:12.5px;color:var(--muted);margin-top:6px}
.dual{display:inline-flex;flex-direction:column;line-height:1.25}
.dual .s{display:flex;flex-wrap:wrap;gap:0 12px;font-size:13px;color:var(--muted)}
.num .dual{align-items:flex-end}
.num .dual .s{justify-content:flex-end}
.dual.big .p{font:600 24px/1.15 var(--serif)}
.wsec{margin-bottom:28px}
.wsec-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px}
.wsec-head h2{font:600 22px/1.2 var(--serif);margin:0}
.wsec-head .sp{margin-left:auto}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fields label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.fields input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%;color:var(--ink)}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.hist span{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{text-align:left;font-weight:600;font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}
.tbl th .sub{font-weight:400;color:var(--muted)}
.tbl td{padding:8px 12px;vertical-align:middle}
.tbl tbody td{border-top:1px solid var(--line)}
.tbl tbody tr:first-child td{border-top:0}
.tbl th.num,.tbl td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:600;border-top:1px solid var(--line);background:color-mix(in srgb,var(--line) 35%,transparent)}
.tbl .nm{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500}
.tbl .nm:hover{color:var(--brand)}
.tbl .sub{display:block;font-size:12.5px;color:var(--muted)}
.tbl input.mv-in{width:112px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 7px;text-align:right;color:var(--ink)}
.pos{color:var(--ok);font-weight:600}
.neg{color:var(--accent);font-weight:600}
.pbar{height:9px;background:var(--line);border-radius:5px;overflow:hidden;margin:0 0 16px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .35s ease}
.chart-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 4px;margin-bottom:14px}
.chart-wrap svg{min-width:520px;width:100%;height:auto;display:block}
.chart-wrap text{fill:var(--muted);font:11px var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 4px 8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chip .code{font-size:11px;padding:2px 4px}
.meter .top .nm{display:inline-flex;align-items:center;gap:7px}
.meter .code{color:var(--hero-ink);border-color:rgba(255,255,255,.45);font-size:11px;padding:2px 4px}
.mod-add{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--hero-ink);border-radius:7px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.mod-add:hover{background:rgba(255,255,255,.12)}
.dlg .codeinfo{margin:-6px 0 0;font-size:13px;color:var(--muted)}

main{padding:22px 20px 60px}
.note{font-size:13px;color:var(--muted);margin:0 0 18px;max-width:75ch}

/* Etapas */
.phase{margin-bottom:30px}
.phase-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:8px}
.phase-head h2{font:600 22px/1.2 var(--serif);margin:0}
.phase-head .per{color:var(--muted);font-size:13px}
.phase-head .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.row-title{background:none;border:0;text-align:left;cursor:pointer;padding:2px 0;font-weight:500}
.row.done .row-title{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.due.over{color:var(--accent);font-weight:600}
.pill{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.detail{padding:2px 14px 14px 44px;font-size:14px}
.detail p{margin:0 0 8px;max-width:70ch}
.detail .links{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}
.detail .notes{background:var(--bg);border-radius:6px;padding:8px 10px;white-space:pre-wrap;color:var(--muted)}
.empty{padding:16px 14px;color:var(--muted)}

/* Kanban */
.board{display:grid;grid-template-columns:repeat(3,minmax(270px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:12px;padding:10px;min-height:140px;transition:background .15s}
.col.over{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.col h3{font:600 17px/1.2 var(--serif);margin:2px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
.col h3 span{font:400 13px var(--sans);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:grab}
.card[data-cat="udesc"]{border-left-color:var(--c-udesc)}
.card[data-cat="mex"]{border-left-color:var(--c-mex)}
.card[data-cat="fin"]{border-left-color:var(--c-fin)}
.card[data-cat="pes"]{border-left-color:var(--c-pes)}
.card.dragging{opacity:.4}
.card.drop-before{box-shadow:0 -3px 0 0 var(--brand)}
.card .t{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-weight:500;display:block;width:100%}
.card .m{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.mv{display:flex;gap:2px}
.mv button{border:1px solid var(--line);background:transparent;border-radius:6px;width:26px;height:24px;cursor:pointer;line-height:1}
.mv button:hover:not(:disabled){border-color:var(--brand)}
.mv button:disabled{opacity:.3;cursor:default}

/* Links */
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.lk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lk a{font-weight:600;word-break:break-word}
.lk .host{font-size:12.5px;color:var(--muted);display:block}
.lk .for{font-size:13px;color:var(--muted);margin-top:6px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(20,12,34,.55)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h2{font:600 22px var(--serif);margin:0}
.dlg label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.dlg input,.dlg select,.dlg textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;color:var(--ink);width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
@media (max-width:640px){
  .row-main{grid-template-columns:auto 1fr}
  .row-main .meta{grid-column:2;white-space:normal;flex-wrap:wrap}
  .detail{padding-left:14px}
  .g2{grid-template-columns:1fr}
}
/* refinamento visual */
:root{--shadow:0 1px 2px color-mix(in srgb,var(--ink) 8%,transparent),0 6px 18px color-mix(in srgb,var(--ink) 6%,transparent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:none}}
:root[data-theme="dark"]{--shadow:none}
.tile,.card2,.tbl-wrap,.chart-wrap,.list,.lk{border-radius:14px;box-shadow:var(--shadow)}
.tile{position:relative;overflow:hidden;padding:16px 16px 14px 21px}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tc,var(--brand))}
.tile .tl{font-weight:500}
.tile.hl{background:var(--hero);border-color:var(--hero);color:var(--hero-ink)}
.tile.hl::before{background:var(--accent)}
.tile.hl .tl,.tile.hl .ts,.tile.hl .dual .s{color:var(--hero-muted)}
.card{border-radius:10px;box-shadow:var(--shadow);transition:transform .12s ease}
.card:hover{transform:translateY(-1px)}
.col{border-radius:14px}
.card2{padding:16px}
.rates{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.rp{display:inline-flex;gap:7px;align-items:baseline;border-radius:999px;background:var(--bg);border:1px solid var(--line);padding:5px 14px;font-size:14px}
.rp b{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:8px;vertical-align:middle}
.seg button{background:transparent;border:0;padding:3px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.legend{align-items:center}
.legend .sp{margin-left:auto}
.chart-wrap{padding:14px 14px 6px}
.tbl thead th{background:color-mix(in srgb,var(--line) 30%,transparent)}
.legend b{color:var(--ink);font-weight:600;margin-right:2px}
.legend .lg{display:inline-flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.chart-wrap svg{min-width:640px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* --- Layout lateral DHUNA-UNAM --- */
:root{--navy:#17243a;--navy2:#20324d;--navaccent:#2c65c7;--surface2:#f9fbff}
body{background:#f3f6fb;color:#17233b}
.app-shell{min-height:100vh;display:flex}
.sidebar{width:238px;flex:0 0 238px;background:linear-gradient(180deg,#162238,#1d2b42);color:#eef4ff;display:flex;flex-direction:column;min-height:100vh;padding:24px 14px 18px;position:sticky;top:0;height:100vh}
.side-brand{text-align:center;padding:8px 6px 32px}
.brand-mark{width:66px;height:66px;border-radius:18px;background:linear-gradient(145deg,#e9b34c,#b77917);color:#24344d;display:grid;place-items:center;margin:0 auto 12px;font-size:34px;font-weight:800;box-shadow:0 7px 22px #0003}
.brand-name{font-weight:800;letter-spacing:.05em;font-size:16px;color:#f8e7b4}
.brand-sub{font-size:12px;color:#c8d4e5;margin-top:3px}
.side-nav-label{font-size:10px;letter-spacing:.13em;color:#a7b5c9;padding:0 12px 10px;font-weight:700}
.side-nav .tabs{display:flex;flex-direction:column;gap:5px}
.side-nav .tab{border:0;border-radius:10px;text-align:left;padding:12px 13px;color:#dce6f5;display:flex;align-items:center;gap:12px;width:100%;border-bottom:0;font-weight:500}
.side-nav .tab[aria-selected="true"]{background:linear-gradient(90deg,#2864c3,#3474d8);color:#fff;box-shadow:0 6px 16px #081a3a55}
.nav-ico{font-size:19px;display:inline-grid;place-items:center;width:23px;opacity:.95}
.side-trip{margin-top:auto;border:1px solid #435776;background:#20324b;border-radius:15px;padding:18px 12px;text-align:center;display:flex;flex-direction:column;gap:4px;font-size:12px;color:#c9d6e8}
.side-trip strong{color:#f1f6ff;font-size:14px;margin-top:4px}.trip-icon{font-size:27px;color:#8dc0ff}
.side-foot{text-align:center;color:#8fa0b8;font-size:10px;margin-top:16px}
.main-shell{flex:1;min-width:0}
.hero{background:transparent;color:var(--ink);padding:26px 28px 16px;border-bottom:1px solid #e1e7f0}
.hero .wrap{max-width:1440px;margin:0}
.hero h1{font-family:var(--sans);font-weight:750;font-size:30px;letter-spacing:-.03em;color:#172b50}
.hero p{color:#66758c}
.hero .count{color:#1b4f9e}
.hero-row{align-items:center;gap:18px}
.hero-actions{gap:7px}
.hero .btn{background:#fff;border-color:#d9e2ee;color:#30415b}
.hero .btn.primary{background:#2463c3;color:#fff;border-color:#2463c3}
.meters{margin-top:18px;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.meter{background:#fff;border:1px solid #e0e7f1;border-radius:12px;padding:10px 12px;box-shadow:0 2px 8px #172b5008}
.meter .top{color:#66758c}.meter .top b{color:#172b50}
.bar{background:#e9eef6}.bar>i{background:#2463c3}
.meter[data-cat="udesc"] .bar>i{background:#8a68c5}.meter[data-cat="mex"] .bar>i{background:#d88a39}.meter[data-cat="fin"] .bar>i{background:#19946c}.meter[data-cat="pes"] .bar>i{background:#4b83d3}
.bar-nav{position:static;background:transparent;border:0}
.bar-nav .wrap{max-width:1440px;margin:0;padding:0 28px}
.chips{padding:0 0 4px}
main{padding:10px 28px 36px}
main .wrap{max-width:1440px;margin:0}
#view{min-width:0}
.phase,.wsec,.card2,.tbl-wrap,.home-panel,.home-metric{border-radius:14px}

/* Indicador de cobertura financeira */
.coverage{border:1px solid #cfe0fa;background:linear-gradient(135deg,#f7faff,#edf5ff);border-radius:17px;padding:22px 24px;margin:14px 0 20px;color:#152a50}
.coverage-title{font-size:20px;font-weight:750;margin-bottom:18px}
.coverage-grid{display:grid;grid-template-columns:190px 1.2fr 1.3fr minmax(200px,.9fr);align-items:center;gap:22px}
.coverage-ring-wrap{display:flex;justify-content:center}
.coverage-ring{width:158px;height:158px;border-radius:50%;background:conic-gradient(#16884f var(--progress),#d7e3f5 0);display:grid;place-items:center}
.coverage-ring-inner{width:130px;height:130px;border-radius:50%;background:#f7faff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.coverage-ring-inner strong{font-size:35px;color:#142743}.coverage-ring-inner span{font-size:13px;color:#60738e}
.coverage-total{border-left:1px solid #b9cce8;padding-left:24px;display:flex;flex-direction:column;gap:7px}
.coverage-label{font-size:15px;color:#344b6a}.coverage-amount{font-size:32px;color:#13854f;line-height:1.2}
.coverage-total span:last-child{font-size:14px}
.coverage-breakdown{border-left:1px solid #b9cce8;padding-left:22px;display:flex;flex-direction:column;gap:12px}
.coverage-breakdown>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.coverage-breakdown strong{margin-left:auto}
.coverage-breakdown hr{border:0;border-top:1px solid #b9cce8;width:100%;margin:2px 0}
.coverage-breakdown .coverage-sum{font-weight:700}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.savings-dot{background:#15945b}.income-dot{background:#347bd0}
.coverage-gap{background:#dceafe;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.coverage-gap span{font-weight:700}.coverage-gap strong{font-size:28px;color:#2059b0}.coverage-gap small{color:#344b6a}
@media(max-width:1050px){.coverage-grid{grid-template-columns:180px 1fr 1fr}.coverage-gap{grid-column:1/-1}}

function nextCode(s,cat){
  var p=CODES[cat];s.counters[p]=(s.counters[p]||0)+1;
  return p+'-'+pad2(s.counters[p]);
}
function ensureCodes(s){
  migrate(s);
  s.counters=s.counters||{};
  var by={};Object.keys(CODES).forEach(function(c){by[c]=[]});
  s.tasks.forEach(function(t,i){
    if(!CODES[t.cat])t.cat='udesc';
    var m=/^([A-Z]{2})-(\d+)$/.exec(t.code||'');
    if(m&&m[1]===LEGACY[t.cat]){m[1]=CODES[t.cat];t.code=m[1]+'-'+m[2];}
    if(m&&m[1]===CODES[t.cat]){s.counters[m[1]]=Math.max(s.counters[m[1]]||0,+m[2]);}
    else by[t.cat].push({t:t,i:i});
  });
  Object.keys(by).forEach(function(c){
    by[c].sort(function(a,b){return (a.t.due||'9').localeCompare(b.t.due||'9')||a.i-b.i}).forEach(function(o){o.t.code=nextCode(s,c)});
  });
  return s;
}

/* ---------- carteira ---------- */
var MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var CURS={BRL:{sym:'R$',n:'Reais (R$)'},MXN:{sym:'MX$',n:'Pesos mexicanos (MX$)'},USD:{sym:'US$',n:'Dólares americanos (US$)'}};
function wal(){return state.wallet}
function rate(){return wal().rate>0?wal().rate:1}
function usd(){return wal().usd>0?wal().usd:1}
function money(v,cur,d){
  d=d||0;
  return (CURS[cur]?CURS[cur].sym:'R$')+'\u00a0'+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fx(n,d){return Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function toBRL(v,cur){return cur==='MXN'?v*rate():cur==='USD'?v*usd():v}
function sec(brl){
  return h('span',{class:'s'},h('span',{},money(brl/rate(),'MXN')),h('span',{},money(brl/usd(),'USD')));
}
function dual(brl,cls){
  return h('span',{class:'dual'+(cls?' '+cls:'')},h('span',{class:'p'},money(brl,'BRL')),sec(brl));
}
function m3(brl){return money(brl,'BRL')+' ('+money(brl/rate(),'MXN')+', '+money(brl/usd(),'USD')+')'}
function mLabel(k){var p=k.split('-');return MESES[+p[1]-1]+'/'+p[0].slice(2)}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function itemBRL(it){var b=toBRL(+it.amount||0,it.cur);return it.type==='mensal'?b*wal().months:b}
function sumItems(list){

  svg.append(s('text',{x:WD-mr+8,y:mt-8,'text-anchor':'start',style:'font-weight:600'},sym2));
  if(sav.length&&stay.length)svg.append(s('line',{x1:xs,x2:xs,y1:mt-22,y2:mt+ph,stroke:'var(--muted)','stroke-width':'1','stroke-dasharray':'4 4'}));
  function tip(label,a,b,na,nb){
    return s('title',{},label+': '+na+' '+money(a,'BRL')+' ('+money(a/rate(),'MXN')+', '+money(a/usd(),'USD')+'); '+nb+' '+money(b,'BRL')+' ('+money(b/rate(),'MXN')+', '+money(b/usd(),'USD')+')');
  }
  function monthLabel(g,cx,m){
    g.append(s('text',{x:cx,y:HT-13,'text-anchor':'middle',style:m===nowKey?'fill:var(--ink);font-weight:600':''},mLabel(m)));
  }
  sav.forEach(function(r,i){
    var cx=ml+gw*i+gw/2,hm=ph*r.meta/top,hr=ph*r.real/top;
    var g=s('g',{},tip(mLabel(r.m),r.meta,r.real,'meta','guardado'));
    var mx=cx-bw-2,rx2=cx+2;
    if(r.m===nowKey)g.append(s('rect',{x:ml+gw*i+3,y:mt,width:gw-6,height:ph,rx:8,fill:'var(--brand)','fill-opacity':'0.08'}));
    if(hm>0)g.append(s('path',{d:barPath(mx,mt+ph-hm,bw,hm,5),fill:'var(--brand)','fill-opacity':'0.2',stroke:'var(--brand)','stroke-width':'1.5'}));
    if(hr>0){
      g.append(s('path',{d:barPath(rx2,mt+ph-hr,bw,hr,5),fill:'var(--ok)'}));
      g.append(s('text',{x:rx2+bw/2,y:mt+ph-hr-5,'text-anchor':'middle',style:'font-size:10px;fill:var(--ink);font-weight:600'},cf.format(r.real)));
    }
    monthLabel(g,cx,r.m);
    svg.append(g);
  });
  stay.forEach(function(r,i){
    var cx=xs+gw*i+gw/2,hc=ph*r.cost/top,hi=ph*r.inc/top;
    var g=s('g',{},tip(mLabel(r.m),r.cost,r.inc,'gastos planejados','receitas'));
    if(r.m===nowKey)g.append(s('rect',{x:xs+gw*i+3,y:mt,width:gw-6,height:ph,rx:8,fill:'var(--c-mex)','fill-opacity':'0.1'}));
    if(hc>0)g.append(s('path',{d:barPath(cx-bw-2,mt+ph-hc,bw,hc,5),fill:'var(--c-mex)'}));
    if(hi>0)g.append(s('path',{d:barPath(cx+2,mt+ph-hi,bw,hi,5),fill:'var(--c-pes)'}));
    monthLabel(g,cx,r.m);
    svg.append(g);
  });
  return svg;
}
function editItem(id,kind){
  var w=wal(),inc=kind==='income',key=inc?'income':'items';
  var isNew=!id;
  var it=isNew?{id:(inc?'i':'w')+Date.now(),name:'',type:inc?'mensal':'unico',amount:0,cur:'BRL',notes:''}:w[key].filter(function(x){return x.id===id})[0];
  if(!it)return;
  var dlg=document.getElementById('dlg');dlg.textContent='';
  function opt(v,l,cur){var o=h('option',{value:v},l);if(v===cur)o.selected=true;return o}
  var f=h('form',{class:'dlg',onsubmit:async function(e){
    e.preventDefault();
    var name=f.querySelector('#iName').value.trim();
    if(!name){f.querySelector('#iName').focus();return}
    var amt=parseFloat(f.querySelector('#iAmt').value);
    var previous=Object.assign({},it);
    it.name=name;it.type=f.querySelector('#iType').value;it.amount=amt>=0?amt:0;
    it.cur=f.querySelector('#iCur').value;it.notes=f.querySelector('#iNotes').value.trim();
    try{if(remoteReady)await persistFinanceItem(it,isNew,kind);if(isNew)w[key].push(it);save();dlg.close();render();toast(isNew?(inc?'Receita adicionada':'Custo adicionado'):(inc?'Receita salva':'Custo salvo'));}
    catch(err){Object.assign(it,previous);toast('Não foi possível salvar no Supabase: '+(err.message||err));}
  }},
    h('h2',{},isNew?(inc?'Nova receita':'Novo custo'):(inc?'Editar receita':'Editar custo')),
    h('label',{},'Nome',h('input',{id:'iName',value:it.name,required:true,maxlength:'120',placeholder:inc?'Bolsa UDESC':''})),
    h('div',{class:'g2'},
      h('label',{},'Tipo',h('select',{id:'iType',disabled:!isNew},opt('unico',inc?'Receita única':'Custo único',it.type),opt('mensal',inc?'Receita mensal, durante a estadia':'Custo mensal, durante a estadia',it.type))),
      h('label',{},'Moeda do valor',h('select',{id:'iCur'},opt('BRL',CURS.BRL.n,it.cur),opt('MXN',CURS.MXN.n,it.cur),opt('USD',CURS.USD.n,it.cur)))),
    h('label',{},inc?'Valor (por mês, se for receita mensal)':'Valor (por mês, se for custo mensal)',h('input',{id:'iAmt',type:'number',min:'0',step:'any',value:String(it.amount),required:true})),
    h('label',{},'Observações',h('textarea',{id:'iNotes',rows:'2'},it.notes)),
    h('p',{id:'iPrev',class:'codeinfo'}),
    h('div',{class:'dlg-actions'},
      isNew?h('span'):h('button',{class:'btn danger',type:'button',onclick:function(){
        if(confirm(inc?'Excluir esta receita?':'Excluir este custo?')){(async function(){try{if(remoteReady)await excluirFinanceiro(it);w[key]=w[key].filter(function(x){return x.id!==it.id});save();dlg.close();render();toast(inc?'Receita excluída':'Custo excluído')}catch(err){toast('Não foi possível excluir: '+(err.message||err))}})()}
      }},'Excluir'),
      h('span',{style:'display:flex;gap:8px'},
        h('button',{class:'btn ghost',type:'button',onclick:function(){dlg.close()}},'Cancelar'),
        h('button',{class:'btn primary',type:'submit'},inc?'Salvar receita':'Salvar custo'))));
  function prev(){
    var a=parseFloat(f.querySelector('#iAmt').value)||0,c=f.querySelector('#iCur').value,t=f.querySelector('#iType').value;
    var b=toBRL(a,c)*(t==='mensal'?w.months:1);
    f.querySelector('#iPrev').textContent=(inc?'Total previsto: ':'Total planejado: ')+money(b,'BRL')+', '+money(b/rate(),'MXN')+' e '+money(b/usd(),'USD')+(t==='mensal'?' ('+w.months+' meses)':'');
  }
  ['#iAmt','#iCur','#iType'].forEach(function(q){var el=f.querySelector(q);el.addEventListener('input',prev);el.addEventListener('change',prev)});
  prev();
  dlg.append(f);dlg.showModal();f.querySelector('#iName').focus();
}

var XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
var H_ACT=['Código','Módulo','Etapa','Atividade','Descrição','Prazo','Situação','Links','Anotações','ID'];
var H_ITEM=['Tipo','Item','Valor','Moeda','Observações','Total planejado (R$)','Total planejado (MX$)','Total planejado (US$)','ID'];
var H_SAV=['Mês (AAAA-MM)','Meta (R$)','Meta (MX$)','Meta (US$)','Guardado (R$)','Guardado (MX$)','Guardado (US$)','Diferença (R$)'];
var H_STAY=['Mês (AAAA-MM)','Gastos mensais (R$)','Gastos mensais (MX$)','Gastos mensais (US$)','Receitas (R$)','Receitas (MX$)','Receitas (US$)','Saldo (R$)'];
var H_RATE=['Data','Moeda','Cotação (R$)'];
var P_LABELS={
  depart:'Data de partida (AAAA-MM-DD)',
  months:'Meses de estadia',
  rate:'Cotação do peso (R$ por MX$ 1)',
  rateDate:'Data da cotação do peso',
  usd:'Cotação do dólar (R$ por US$ 1)',
  usdDate:'Data da cotação do dólar',

function getDownloads(){
  try{return window.claude&&window.claude.use?window.claude.use('downloads'):null}catch(e){return null}

function r2(n){return Math.round((+n||0)*100)/100}
function conv(brl){return [r2(brl),r2(brl/rate()),r2(brl/usd())]}
function statusLabel(k){var s=STATUS.filter(function(x){return x[0]===k})[0];return s?s[1]:'A fazer'}
function phaseLabel(id){var p=PHASES.filter(function(x){return x.id===id})[0];return p?p.name:''}
function stamp(){
  var d=new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+'_'+pad2(d.getHours())+'-'+pad2(d.getMinutes())+'-'+pad2(d.getSeconds());
}
function buildSheets(){
  var w=wal(),tot=totals(),inc=incomeTotals(),gm=goalData(),out=[];
  function add(name,aoa,widths){out.push({name:name,aoa:aoa,widths:widths})}
  var res=[['Indicador','R$','MX$','US$']];
  [['Total planejado',tot.total],['Custos únicos',tot.one],['Custos mensais',tot.mo],['Receitas na estadia',inc.total],['Meta total a guardar',gm.needed],['Meta de poupança por mês',gm.monthly],['Guardado até agora',gm.saved]].forEach(function(x){
    res.push([x[0]].concat(conv(x[1])));
  });
  res.push([]);
  res.push(['Data de partida',{d:state.depart}]);
  res.push(['Meses de estadia',w.months]);
  res.push(['Cotação do peso (R$ por MX$ 1)',w.rate]);
  res.push(['Cotação do dólar (R$ por US$ 1)',w.usd]);
  add('Resumo',res,[34,16,16,16]);
  var cats=Object.keys(CATS);
  var tasks=state.tasks.slice().sort(function(a,b){
    var ca=cats.indexOf(a.cat),cb=cats.indexOf(b.cat);
    return ca-cb||String(a.code).localeCompare(String(b.code),'pt-BR',{numeric:true});
  });
  var act=[H_ACT];
  tasks.forEach(function(t){
    act.push([t.code,CATS[t.cat],phaseLabel(t.phase),t.title,t.desc||'',t.due||'',statusLabel(t.status),(t.links||[]).map(function(l){return l.label+' | '+l.url}).join('\n'),t.notes||'',t.id]);
  });
  add('Atividades',act,[10,26,32,52,60,12,14,50,40,12]);
  function itemRows(list){
    var rows=[H_ITEM];
    list.forEach(function(it){
      var c=conv(itemBRL(it));
      rows.push([it.type==='mensal'?'Mensal':'Único',it.name,+it.amount||0,it.cur,it.notes||'',c[0],c[1],c[2],it.id]);
    });
    return rows;
  }
  add('Custos',itemRows(w.items),[10,42,14,8,42,20,20,20,12]);
  add('Receitas',itemRows(w.income||[]),[10,42,14,8,42,20,20,20,12]);
  var sav=[H_SAV];
  gm.rows.forEach(function(r){
    var m=conv(r.meta),g=conv(r.real);
    sav.push([r.m,m[0],m[1],m[2],g[0],g[1],g[2],r2(r.real-r.meta)]);
  });
  add('Poupança',sav,[16,14,14,14,14,14,14,16]);
  var stay=[H_STAY];
  gm.stay.forEach(function(r){
    var c=conv(r.cost),i=conv(r.inc);
    stay.push([r.m,c[0],c[1],c[2],i[0],i[1],i[2],r2(r.inc-r.cost)]);
  });
  add('Estadia',stay,[16,18,18,18,16,16,16,14]);
  var rt=[H_RATE];
  (w.history||[]).forEach(function(x){rt.push([x.date,x.cur,x.rate])});
  add('Cotações',rt,[14,10,14]);
  var par=[['Parâmetro','Valor']];
  par.push([P_LABELS.depart,state.depart]);
  par.push([P_LABELS.months,w.months]);
  par.push([P_LABELS.rate,w.rate]);
  par.push([P_LABELS.rateDate,w.rateDate||'']);
  par.push([P_LABELS.usd,w.usd]);
  par.push([P_LABELS.usdDate,w.usdDate||'']);
  par.push([P_LABELS.start,w.goal.start||'']);
  par.push([P_LABELS.saved0,w.goal.saved0||0]);
  par.push([P_LABELS.other,w.goal.other||0]);
  add('Parâmetros',par,[40,18]);
  return out;
}

function plainBlob(sheets){
  var wb=XLSX.utils.book_new();
  sheets.forEach(function(sh){
    var ws=XLSX.utils.aoa_to_sheet(sh.aoa.map(function(r){return r.map(function(v){return v&&typeof v==='object'&&v.d?v.d:v})}));
    ws['!cols']=sh.widths.map(function(x){return {wch:x}});
    XLSX.utils.book_append_sheet(wb,ws,sh.name);
  });
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:XLSX_MIME});
}

function bufToB64(buf){
  var b=new Uint8Array(buf),s='',i,CH=0x8000;

function sheetPaths(wbXml,relsXml){

    var t=r.getAttribute('Target');
    rels[r.getAttribute('Id')]=t.charAt(0)==='/'?t.slice(1):'xl/'+t;
  });
  var map={};
  [].slice.call(parseXml(wbXml).getElementsByTagName('sheet')).forEach(function(s){

  if(val==null||val==='')return;
  if(val&&typeof val==='object'&&val.d){
    var v1=doc.createElementNS(NS_MAIN,'v');v1.textContent=String(serial(val.d));c.appendChild(v1);return;
  }
  if(typeof val==='number'){
    var v=doc.createElementNS(NS_MAIN,'v');v.textContent=String(val);c.appendChild(v);return;
  }
  c.setAttribute('t','inlineStr');
  var is=doc.createElementNS(NS_MAIN,'is'),t=doc.createElementNS(NS_MAIN,'t');
  t.setAttributeNS(NS_XML,'xml:space','preserve');
  t.textContent=String(val);
  is.appendChild(t);c.appendChild(is);

function fillSheetXml(xml,aoa){
  var doc=parseXml(xml);
  var sd=doc.getElementsByTagName('sheetData')[0];
  var rows={},oldMax=0;
  [].slice.call(sd.getElementsByTagName('row')).forEach(function(r){
    var n=+r.getAttribute('r');rows[n]=r;if(n>oldMax)oldMax=n;
  });
  var styleRow=null,n;
  for(n=oldMax;n>=2;n--){if(rows[n]){styleRow=rows[n];break}}
  var last=aoa.length;
  while(last>1&&!(aoa[last-1]&&aoa[last-1].length))last--;
  for(var i=2;i<=Math.max(last,oldMax);i++){
    var data=aoa[i-1],row=rows[i];
    if(i>last||!data||!data.length){if(row){sd.removeChild(row);delete rows[i]}continue}
    var base={};
    if(styleRow)[].slice.call(styleRow.getElementsByTagName('c')).forEach(function(c){base[colIndex(c.getAttribute('r'))]=c});
    if(!row){row=styleRow.cloneNode(true);row.setAttribute('r',String(i));rows[i]=row;sd.appendChild(row)}
    row.removeAttribute('spans');
    var old={};
    [].slice.call(row.getElementsByTagName('c')).forEach(function(c){old[colIndex(c.getAttribute('r'))]=c});
    while(row.firstChild)row.removeChild(row.firstChild);
    var ncols=data.length;
    for(var j=1;j<=ncols;j++){
      var src=old[j]||base[j],c=doc.createElementNS(NS_MAIN,'c');
      c.setAttribute('r',colLetter(j)+i);
      if(src&&src.getAttribute('s'))c.setAttribute('s',src.getAttribute('s'));
      setCell(doc,c,data[j-1]);
      row.appendChild(c);
    }
    Object.keys(old).map(Number).sort(function(a,b){return a-b}).forEach(function(j){if(j>ncols)row.appendChild(old[j])});
  }
  var list=[].slice.call(sd.getElementsByTagName('row'));
  list.sort(function(a,b){return +a.getAttribute('r')-+b.getAttribute('r')});
  list.forEach(function(r){sd.removeChild(r)});
  var maxR=1,maxC=1;
  list.forEach(function(r){
    sd.appendChild(r);

function fixTables(zip,sheetPath,oldMax,newMax){

    var jobs=[];
    [].slice.call(parseXml(rx).getElementsByTagName('Relationship')).forEach(function(r){
      if(!/\/table$/.test(r.getAttribute('Type')))return;

}
function templatePaths(zip){
  var a=zip.file('xl/workbook.xml'),b=zip.file('xl/_rels/workbook.xml.rels');
  if(!a||!b)return Promise.reject(new Error('modelo'));
  return Promise.all([a.async('string'),b.async('string')]).then(function(r){return sheetPaths(r[0],r[1])});
}
function fillTemplate(sheets){
  return loadTemplateZip(getTemplateB64(),true).then(function(zip){
    return templatePaths(zip).then(function(map){
      var chain=Promise.resolve();
      sheets.forEach(function(sh){
        chain=chain.then(function(){
          var path=map[sh.name];
          if(!path||!zip.file(path))throw new Error('modelo');
          return zip.file(path).async('string').then(function(xml){
            var res=fillSheetXml(xml,sh.aoa);
            zip.file(path,res.xml);
            return fixTables(zip,path,res.oldMax,res.newMax);
          });
        });
      });
      return chain.then(function(){return zip.generateAsync({type:'blob',mimeType:XLSX_MIME})});
    });
  });
}
function exportXlsx(){
  var dlP=getDownloads();
  var sheets;
  try{sheets=buildSheets()}catch(e){toast('Não foi possível montar o arquivo Excel.');return}
  var usedPlain=false,make;
  if(typeof JSZip!=='undefined'){
    make=fillTemplate(sheets).catch(function(){
      if(!xlsxReady())throw new Error('lib');
      usedPlain=true;return plainBlob(sheets);
    });
  }else if(xlsxReady()){usedPlain=true;make=Promise.resolve(plainBlob(sheets))}
  else{toast('A biblioteca de Excel não carregou. Recarregue a página.');return}
  make.then(function(blob){
    var filename='Dhuna-UNAM_'+stamp()+'.xlsx';
    if(dlP){
      return Promise.resolve(dlP).then(function(dl){
        if(dl&&typeof dl.save==='function')return dl.save({filename:filename,data:blob});
        browserDownload(blob,filename);
      }).then(function(){toast(usedPlain?'Excel exportado sem o modelo (formatação simples)':'Excel exportado')});
    }
    browserDownload(blob,filename);
    toast(usedPlain?'Excel exportado sem o modelo (formatação simples)':'Excel exportado');
  }).catch(function(){toast('Não foi possível gerar ou salvar o arquivo Excel.')});
}
function browserDownload(blob,filename){
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);
  a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1500);
}

        h('button',{class:'btn primary',type:'button',onclick:function(){document.getElementById('fileTpl').click()}},'Carregar modelo')))));
  dlg.showModal();

function num(v){
  if(typeof v==='number')return v;
  var n=parseFloat(String(v==null?'':v).replace(',','.'));
  return isNaN(n)?0:n;
}
function toISO(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){var d=XLSX.SSF.parse_date_code(v);return d?d.y+'-'+pad2(d.m)+'-'+pad2(d.d):''}
  if(v instanceof Date)return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  var t=String(v),m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t);
  if(m)return m[0];
  m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(t);
  return m?m[3]+'-'+m[2]+'-'+m[1]:'';
}
function toMonth(v){
  if(typeof v==='number'||v instanceof Date)return toISO(v).slice(0,7);
  var m=/^(\d{4})-(\d{2})/.exec(String(v||''));
  return m?m[0]:'';
}
function stateFromWorkbook(wb){
  function rows(name){var ws=wb.Sheets[name];return ws?XLSX.utils.sheet_to_json(ws,{defval:''}):null}
  var at=rows('Atividades'),cu=rows('Custos'),pa=rows('Parâmetros');
  if(!at||!cu||!pa)throw new Error('formato');
  var re=rows('Receitas')||[],sv=rows('Poupança')||[],rt=rows('Cotações')||[];
  var P={};pa.forEach(function(r){P[String(r['Parâmetro'])]=r['Valor']});
  var catByName={};
  Object.keys(CATS).forEach(function(k){catByName[CATS[k].toLowerCase()]=k;catByName[CODES[k].toLowerCase()]=k;catByName[k]=k});
  var phaseByName={};PHASES.forEach(function(p){phaseByName[p.name.toLowerCase()]=p.id});
  var statusByName={};STATUS.forEach(function(x){statusByName[x[1].toLowerCase()]=x[0];statusByName[x[0]]=x[0]});
  var used={},tasks=[];
  at.forEach(function(r,i){
    var title=String(r['Atividade']||'').trim();
    if(!title)return;
    var id=String(r['ID']||'').trim();
    if(!id||used[id])id='t'+Date.now().toString(36)+i;
    used[id]=1;
    tasks.push({
      id:id,
      cat:catByName[String(r['Módulo']||'').trim().toLowerCase()]||'udesc',
      phase:phaseByName[String(r['Etapa']||'').trim().toLowerCase()]||'f1',
      title:title,
      desc:String(r['Descrição']||'').trim(),
      due:toISO(r['Prazo']),
      status:statusByName[String(r['Situação']||'').trim().toLowerCase()]||'todo',
      links:parseLinks(String(r['Links']||'')),
      notes:String(r['Anotações']||'').trim(),
      code:String(r['Código']||'').trim()
    });
  });
  function items(list,prefix){
    var seen={},out=[];
    list.forEach(function(r,i){
      var name=String(r['Item']||'').trim();
      if(!name)return;
      var id=String(r['ID']||'').trim();
      if(!id||seen[id])id=prefix+Date.now().toString(36)+i;
      seen[id]=1;
      var cur=String(r['Moeda']||'BRL').trim().toUpperCase();
      cur={'R$':'BRL','MX$':'MXN','US$':'USD'}[cur]||cur;
      out.push({id:id,name:name,type:String(r['Tipo']||'').toLowerCase().indexOf('mens')===0?'mensal':'unico',amount:Math.max(0,num(r['Valor'])),cur:CURS[cur]?cur:'BRL',notes:String(r['Observações']||'').trim()});
    });
    return out;
  }
  var deposits={};
  sv.forEach(function(r){
    var m=toMonth(r['Mês (AAAA-MM)']),v=num(r['Guardado (R$)']);
    if(m&&v>0)deposits[m]=v;
  });
  var history=[];
  rt.forEach(function(r){
    var d=toISO(r['Data']),c=String(r['Moeda']||'').toUpperCase(),v=num(r['Cotação (R$)']);
    if(d&&CURS[c]&&c!=='BRL'&&v>0)history.push({date:d,cur:c,rate:v});
  });
  var rate0=num(P[P_LABELS.rate]),usd0=num(P[P_LABELS.usd]);
  if(!(rate0>0)||!(usd0>0))throw new Error('formato');
  var months=Math.round(num(P[P_LABELS.months]));
  return {
    v:5,
    depart:toISO(P[P_LABELS.depart])||state.depart,
    counters:{},
    tasks:tasks,
    wallet:{
      rate:rate0,rateDate:toISO(P[P_LABELS.rateDate]),
      usd:usd0,usdDate:toISO(P[P_LABELS.usdDate]),
      history:history,
      months:months>=1&&months<=36?months:6,
      items:items(cu,'w'),
      income:items(re,'i'),
      goal:{start:toMonth(P[P_LABELS.start])||'2026-11',saved0:Math.max(0,num(P[P_LABELS.saved0])),other:Math.max(0,num(P[P_LABELS.other]))},
      deposits:deposits
    }
  };
}
document.getElementById('btnExport').addEventListener('click',exportXlsx);
document.getElementById('btnImport').addEventListener('click',function(){document.getElementById('fileImport').click()});
document.getElementById('fileImport').addEventListener('change',function(e){
  if(remoteReady){toast('A importação de Excel/JSON ainda não está habilitada no modo compartilhado. Use a exportação para gerar uma cópia dos dados.');e.target.value='';return;}
  var f=e.target.files[0];if(!f)return;
  var isJson=/\.json$/i.test(f.name),r=new FileReader();
  r.onload=function(){
    try{
      var s;
      if(isJson){s=JSON.parse(r.result);if(!s||!Array.isArray(s.tasks))throw new Error('formato')}
      else{
        if(!xlsxReady())throw new Error('lib');
        s=stateFromWorkbook(XLSX.read(r.result,{type:'array'}));
      }
      if(confirm('Substituir o planejamento atual pelo arquivo importado?')){
        state=ensureCodes(s);save();render();toast('Planejamento importado');
      }
    }catch(err){
      toast(err&&err.message==='lib'?'A biblioteca de Excel não carregou. Recarregue a página.':'Arquivo inválido. Use um Excel exportado por este app.');
    }
  };
  if(isJson)r.readAsText(f);else r.readAsArrayBuffer(f);
  e.target.value='';
});
document.getElementById('btnTpl').addEventListener('click',openTemplateDialog);
document.getElementById('fileTpl').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    if(typeof JSZip==='undefined'){toast('A biblioteca de Excel não carregou. Recarregue a página.');return}
    loadTemplateZip(r.result).then(function(zip){
      return templatePaths(zip).then(function(map){
        var need=['Resumo','Atividades','Custos','Receitas','Poupança','Estadia','Cotações','Parâmetros'];
        if(!need.every(function(n){return map[n]&&zip.file(map[n])}))throw new Error('modelo');
        try{localStorage.setItem(TPL_KEY,bufToB64(r.result))}catch(err){throw new Error('storage')}
        document.getElementById('dlg').close();
        toast('Modelo do Excel atualizado');
      });
    }).catch(function(err){
      toast(err&&err.message==='storage'?'Não foi possível guardar o modelo neste navegador.':'Modelo inválido. Use um arquivo exportado por este app.');
    });
  };
  r.readAsArrayBuffer(f);e.target.value='';
});

// Etapa 3: autenticação e carregamento dos dados compartilhados.
var authGate=document.getElementById('authGate');
var authForm=document.getElementById('authForm');
var authMessage=document.getElementById('authMessage');
var authSubmit=document.getElementById('authSubmit');
var btnLogout=document.getElementById('btnLogout');
var supa=window.DHUNA_UNAM_SUPABASE;
function setAuthUI(session){
 authGate.hidden=!!session;btnLogout.hidden=!session;
 if(session){authMessage.textContent='Sessão autenticada: '+(session.user.email||'usuário');}
 else{authMessage.textContent='';remoteReady=false;}
}
async function iniciarSessao(session){
 if(!session)return;authGate.hidden=false;authMessage.textContent='Carregando planejamento compartilhado…';
 try{await carregarRemoto();authGate.hidden=true;authMessage.textContent='Sessão autenticada: '+(session.user.email||'usuário');}
 catch(err){authGate.hidden=false;authMessage.textContent='Não foi possível carregar os dados: '+(err.message||err);}
}
if(supa){
 supa.auth.getSession().then(async function(r){setAuthUI(r.data.session);if(r.data.session)await iniciarSessao(r.data.session);}).catch(function(){setAuthUI(null)});
 supa.auth.onAuthStateChange(function(event,session){setAuthUI(session);if(session&&(event==='SIGNED_IN'||event==='TOKEN_REFRESHED'))setTimeout(function(){if(!remoteReady)iniciarSessao(session)},0)});
 authForm.addEventListener('submit',async function(ev){ev.preventDefault();authSubmit.disabled=true;authMessage.textContent='Autenticando…';
  try{var result=await supa.auth.signInWithPassword({email:document.getElementById('authEmail').value.trim(),password:document.getElementById('authPassword').value});if(result.error)throw result.error;await iniciarSessao(result.data.session);}
  catch(err){authMessage.textContent=(err&&err.message)||'Não foi possível entrar. Verifique os dados e tente novamente.';authGate.hidden=false;}
  finally{authSubmit.disabled=false;}
 });
 btnLogout.addEventListener('click',async function(){btnLogout.disabled=true;try{var r=await supa.auth.signOut();if(r.error)throw r.error;setAuthUI(null);remoteReady=false;}catch(err){toast('Erro ao sair: '+(err.message||err));}finally{btnLogout.disabled=false;}});
}else{authMessage.textContent='Biblioteca Supabase indisponível. Verifique a conexão com a internet e recarregue.';}

render();
})();
</script>
